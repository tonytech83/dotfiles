name: Script Checks

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.sh"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**/*.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: reviewdog/action-shellcheck@v1
        with:
          reviewdog_flags: "-fail-level=error"

  shfmt:
    name: Shell Fomatting
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

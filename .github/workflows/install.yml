name: Install

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - ".github/**"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup dotfiles
        run: |
          chmod +x setup.sh
          printf 'y\n1\n' | DOTFILES_DIR="$GITHUB_WORKSPACE" ./setup.sh

      - name: Smoke test zsh
        shell: zsh {0}
        run: |
          echo "Zsh version: $ZSH_VERSION"

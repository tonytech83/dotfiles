[general]
live_config_reload = true
working_directory = "None"
# Themes --
import = [ 
  # colors
  "~/.config/alacritty/nordic.toml",
  # key bindings
  "~/.config/alacritty/keybindings.toml"
]

[env]
TERM = "xterm-256color"

[window]
title = "Alacritty"
decorations = "none"
blur = true
opacity = 0.9
padding = { x = 10, y = 10 }

# [window.dimensions]
# columns = 160
# lines = 80

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.0
normal = { family = "Lilex Nerd Font", style = "Regular" }
bold = { family = "Lilex Nerd Font", style = "Bold" }
italic = { family = "Lilex Nerd Font", style = "Italic" }
bold_italic = { family = "Lilex Nerd Font", style = "Bold Italic" }
builtin_box_drawing = false

[colors]
#transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[bell]
command = "None"

[selection]
save_to_clipboard = true

[cursor.style]
shape= "Block"
blinking = "On"

[terminal.shell]
program = "/usr/bin/zsh"

[mouse]
hide_when_typing = true


[debug]
render_timer = true
print_events = true










